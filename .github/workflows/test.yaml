name: On Push

on:
  push:
    branches:
      - 'master'

jobs:
  build:
    name: Build
    env:
      ANT_OPTS: "-Xmx2560m"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "8"

      - name: Run Ant All
        run: ant all

      - name: Run Format Source Script
        run: ./test.sh